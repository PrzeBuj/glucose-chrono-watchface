name: Test on Wear OS emulator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APKs (tarcza + warianty diagnostyczne)
        run: |
          mkdir -p apks
          RAW=watchface/src/main/res/raw/watchface.xml
          cp $RAW /tmp/orig.xml
          for v in tools/variants/*.xml; do
            n=$(basename $v .xml)
            cp $v $RAW
            gradle :watchface:assembleRelease --no-daemon -q
            cp watchface/build/outputs/apk/release/*.apk apks/$n.apk
          done
          cp /tmp/orig.xml $RAW
          gradle :watchface:assembleDebug --no-daemon -q
          cp watchface/build/outputs/apk/debug/*.apk apks/z_full_debug.apk
          gradle :chime:assembleDebug --no-daemon -q
          cp chime/build/outputs/apk/debug/*.apk chime.apk
          ls -la apks chime.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./tools/emulator_check.sh
      - name: Save screenshots to branch emulator-shots
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan emulator-shots
          git rm -rf --cached . >/dev/null
          git add -f shots/
          git commit -m "Zrzuty z emulatora ($GITHUB_RUN_NUMBER)"
          git push -f origin emulator-shots
