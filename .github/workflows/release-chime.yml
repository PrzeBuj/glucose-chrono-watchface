name: Release sygnału godzinowego (Google Play)

# Buduje podpisany AAB aplikacji „Sygnał godzinowy” (com.glucosechrono.chime) i wysyła go do testów wewnętrznych
# (ścieżka Wear OS). Pierwszą wersję wgrywa się ręcznie w Play Console (upload=false), potem już automatycznie.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Wyślij do Google Play"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Odkoduj klucz przesyłania
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu UPLOAD_KEYSTORE_BASE64, zobacz docs/PLAY.md."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Zbuduj AAB sygnału
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          gradle :chime:bundleRelease -PversionCode=$((100 + GITHUB_RUN_NUMBER)) -PversionName=1.0.$GITHUB_RUN_NUMBER --no-daemon
          cp chime/build/outputs/bundle/release/chime-release.aab glucose-chrono-chime.aab
          jarsigner -verify glucose-chrono-chime.aab | grep -q "jar verified"
      - name: Usuń odkodowany klucz
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Dodaj AAB do wydania „play” na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view play >/dev/null 2>&1 || \
            gh release create play --prerelease --title "Pakiet do Google Play" \
              --notes "Podpisany kluczem przesyłania. Wgraj plik .aab w Play Console."
          gh release upload play glucose-chrono-chime.aab --clobber
      # Automatyczne wysyłanie do Google Play (opcjonalne, po jednorazowej konfiguracji z docs/PLAY.md).
      - uses: google-github-actions/auth@v2
        if: inputs.upload && github.ref == 'refs/heads/main'
        id: gcp
        with:
          workload_identity_provider: projects/136179368301/locations/global/workloadIdentityPools/github/providers/glucose-chrono
          service_account: github-deploy@friend-radar-354a3.iam.gserviceaccount.com
      - name: Wyślij do testów wewnętrznych Google Play
        if: inputs.upload && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: com.glucosechrono.chime
          releaseFiles: glucose-chrono-chime.aab
          track: wear:internal
          status: completed
