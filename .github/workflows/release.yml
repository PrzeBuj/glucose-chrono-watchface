name: Release (Google Play)

# Buduje podpisany pakiet AAB dla Google Play. Uruchamiany ręcznie: Actions › Release (Google Play) › Run workflow.
# Pakiet trafia do wydania „play” na GitHubie (do ręcznego wgrania w Play Console), a gdy ustawiona jest zmienna
# repozytorium PLAY_UPLOAD=true, także od razu do testów wewnętrznych w Google Play. Opis: docs/PLAY.md.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Odkoduj klucz przesyłania
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu UPLOAD_KEYSTORE_BASE64, zobacz docs/PLAY.md."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Zbuduj AAB
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          gradle :watchface:bundleRelease -PversionCode=$((100 + GITHUB_RUN_NUMBER)) -PversionName=1.0.$GITHUB_RUN_NUMBER --no-daemon
          cp watchface/build/outputs/bundle/release/watchface-release.aab glucose-chrono-watchface.aab
          jarsigner -verify glucose-chrono-watchface.aab | grep -q "jar verified"
          if unzip -l glucose-chrono-watchface.aab | grep -q '\.dex'; then
            unzip -l glucose-chrono-watchface.aab | grep '\.dex'
            echo "::error::Pakiet zawiera pliki .dex, a tarcza WFF nie może mieć kodu."; exit 1
          fi
      - name: Usuń odkodowany klucz
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Dodaj AAB do wydania „play” na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view play >/dev/null 2>&1 || \
            gh release create play --prerelease --title "Pakiet do Google Play" \
              --notes "Podpisany kluczem przesyłania. Wgraj glucose-chrono-watchface.aab w Play Console."
          gh release upload play glucose-chrono-watchface.aab --clobber
      # Automatyczne wysyłanie do Google Play (opcjonalne, po jednorazowej konfiguracji z docs/PLAY.md).
      - uses: google-github-actions/auth@v2
        if: vars.PLAY_UPLOAD == 'true' && github.ref == 'refs/heads/main'
        id: gcp
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Wyślij do testów wewnętrznych Google Play
        if: vars.PLAY_UPLOAD == 'true' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: com.glucosechrono.watchface
          releaseFiles: glucose-chrono-watchface.aab
          track: wear:internal
          status: completed
