name: Build watch face

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: |
          gradle :watchface:assembleRelease --no-daemon
          cp watchface/build/outputs/apk/release/*.apk glucose-chrono-watchface.apk
          gradle :watchface:bundleRelease --no-daemon
          if unzip -l watchface/build/outputs/bundle/release/*.aab | grep '\.dex'; then
            echo "::error::Pakiet zawiera pliki .dex, a tarcza WFF nie może mieć kodu."; exit 1
          fi
          if unzip -l glucose-chrono-watchface.apk | grep '\.dex'; then
            echo "::error::APK zawiera pliki .dex."; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tarcza-glukoza-apk
          path: glucose-chrono-watchface.apk
      - name: Publish to "latest" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Najnowsza wersja" \
              --notes "Plik APK tarczy budowany automatycznie z gałęzi main."
          gh release upload latest glucose-chrono-watchface.apk --clobber
