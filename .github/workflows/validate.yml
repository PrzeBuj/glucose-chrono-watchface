name: Validate watch face XML

on:
  push:
    paths:
      - "watchface/src/main/res/raw/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź watchface.xml ze schematem WFF v2
        run: |
          sudo apt-get install -y -qq libxml2-utils >/dev/null
          git clone --depth 1 https://github.com/google/watchface /tmp/wf
          D=/tmp/wf/third_party/wff/specification/documents/2
          ls $D
          xmllint --noout --schema $D/watchface.xsd watchface/src/main/res/raw/watchface.xml
