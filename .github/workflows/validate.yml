name: Validate watch face XML

on:
  push:
    paths:
      - "watchface/src/main/res/raw/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sprawdź watchface.xml oficjalnym walidatorem WFF
        run: |
          git clone --depth 1 https://github.com/google/watchface /tmp/wf
          cat /tmp/wf/tools/dwf-validator-cli/build.gradle
          cat /tmp/wf/tools/settings.gradle
          cd /tmp/wf/tools && chmod +x gradlew && ./gradlew -q tasks --all | grep -i "validator" | head -40
