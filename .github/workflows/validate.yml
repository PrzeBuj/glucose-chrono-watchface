name: Validate watch face XML

on:
  push:
    paths:
      - "watchface/src/main/res/raw/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sprawdź watchface.xml oficjalnym walidatorem WFF
        run: |
          git clone --depth 1 https://github.com/google/watchface /tmp/wf
          cd /tmp/wf/third_party/wff
          chmod +x gradlew
          ./gradlew -q :specification:validator:executable-jar
          java -jar specification/validator/build/libs/wff-validator.jar 2 "$GITHUB_WORKSPACE/watchface/src/main/res/raw/watchface.xml"
