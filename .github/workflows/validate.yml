name: Validate watch face XML

on:
  push:
    paths:
      - "watchface/src/main/res/raw/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pobierz walidator Watch Face Format
        run: |
          git clone --depth 1 https://github.com/google/watchface /tmp/wf
          find /tmp/wf -maxdepth 4 -type d | grep -iv '\.git' | head -60
          find /tmp/wf -name "*.xsd" | head -20
          find /tmp/wf -iname "README*" -path "*valid*" | head
