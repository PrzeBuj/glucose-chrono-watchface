name: Validate watch face XML

on:
  push:
    paths:
      - "watchface/src/main/res/raw/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sprawdź watchface.xml oficjalnym walidatorem WFF
        run: |
          git clone --depth 1 https://github.com/google/watchface /tmp/wf
          cd /tmp/wf/third_party/wff
          ls; cat settings.gradle* ; ls specification/validator; cat specification/validator/build.gradle* | head -60
          find . -iname "README*" | head; cat README.md 2>/dev/null | head -60
